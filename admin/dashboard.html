<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Redline Electric</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<header class="admin-header">
  <img src="../assets/redline-electric-logo.png" alt="Redline Electric" width="400" height="188" class="admin-logo-sm">
  <h1 class="display">Dashboard</h1>
  <button type="button" class="btn-ghost" id="logout-btn">Log Out</button>
</header>

<main class="admin-main">
  <div class="admin-tabs">
    <button type="button" class="admin-tab-btn is-active" data-tab="photos">Job Photos</button>
    <button type="button" class="admin-tab-btn" data-tab="leads">Leads</button>
    <button type="button" class="admin-tab-btn" data-tab="business">Business Info</button>
    <button type="button" class="admin-tab-btn" data-tab="reviews">Reviews</button>
  </div>

  <div id="tab-photos" class="admin-tab-panel">
    <section class="admin-upload">
      <h2 class="display">Upload New Photo</h2>
      <form id="upload-form" class="admin-form">
        <label>Title
          <input type="text" id="title" required>
        </label>
        <label>Description
          <textarea id="description" rows="3"></textarea>
        </label>
        <label>Category
          <input type="text" id="category">
        </label>
        <label>Photo
          <input type="file" id="file" accept="image/*" required>
        </label>
        <button type="submit" class="btn-primary" id="upload-btn">Upload</button>
        <p id="upload-status" class="admin-status" hidden>Optimizing image...</p>
        <p id="upload-warning" class="admin-warning" hidden></p>
        <p id="upload-error" class="admin-error" hidden></p>
        <p id="upload-success" class="admin-success" hidden>Uploaded.</p>
      </form>
    </section>

    <section class="admin-list">
      <h2 class="display">Existing Photos</h2>
      <div class="admin-bulk-bar">
        <label class="admin-select-all-label"><input type="checkbox" id="photos-select-all"> Select All</label>
        <span id="photos-bulk-count" class="admin-bulk-count" hidden></span>
        <button type="button" class="admin-bulk-delete-btn" id="photos-bulk-delete-btn" hidden>Delete Selected</button>
      </div>
      <div id="projects-grid" class="admin-grid"></div>
      <p id="empty-msg" class="admin-empty" hidden></p>
    </section>
  </div>

  <div id="tab-leads" class="admin-tab-panel" hidden>
    <section class="admin-list">
      <h2 class="display">Leads</h2>
      <div class="admin-bulk-bar">
        <span id="leads-bulk-count" class="admin-bulk-count" hidden></span>
        <button type="button" class="admin-bulk-delete-btn" id="leads-bulk-delete-btn" hidden>Delete Selected</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="leads-select-all" aria-label="Select all leads"></th>
              <th>Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Service</th>
              <th>Message</th>
              <th>Status</th>
              <th>Received</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody id="leads-tbody"></tbody>
        </table>
      </div>
      <p id="leads-empty-msg" class="admin-empty" hidden></p>
    </section>
  </div>

  <div id="tab-business" class="admin-tab-panel" hidden>
    <section class="admin-upload">
      <h2 class="display">Business Info</h2>
      <form id="business-form" class="admin-form">
        <label>Phone
          <input type="text" id="biz-phone" placeholder="619-748-0662">
        </label>
        <label>WhatsApp
          <input type="text" id="biz-whatsapp" placeholder="619-748-0662">
        </label>
        <label>Email
          <input type="email" id="biz-email">
        </label>
        <label>Hours
          <input type="text" id="biz-hours" placeholder="e.g. Mon–Fri 8am–6pm">
        </label>
        <label>Service Areas
          <input type="text" id="biz-service-areas" placeholder="e.g. San Diego County">
        </label>
        <label>About Text
          <textarea id="biz-about" rows="4"></textarea>
        </label>
        <label>Profile Photo
          <input type="file" id="biz-photo-file" accept="image/*">
        </label>
        <div id="biz-photo-preview-wrap" hidden>
          <img id="biz-photo-preview" class="admin-profile-preview" alt="Profile photo preview">
        </div>
        <button type="submit" class="btn-primary" id="business-save-btn">Save Changes</button>
        <p id="business-status" class="admin-status" hidden>Optimizing image...</p>
        <p id="business-warning" class="admin-warning" hidden></p>
        <p id="business-error" class="admin-error" hidden></p>
        <p id="business-success" class="admin-success" hidden>Saved.</p>
      </form>
    </section>
  </div>

  <div id="tab-reviews" class="admin-tab-panel" hidden>
    <section class="admin-upload">
      <h2 class="display">Add Review</h2>
      <form id="review-form" class="admin-form">
        <label>Customer Name
          <input type="text" id="review-name" required>
        </label>
        <label>Rating
          <select id="review-rating" required>
            <option value="5">★★★★★ (5)</option>
            <option value="4">★★★★☆ (4)</option>
            <option value="3">★★★☆☆ (3)</option>
            <option value="2">★★☆☆☆ (2)</option>
            <option value="1">★☆☆☆☆ (1)</option>
          </select>
        </label>
        <label>Review Text
          <textarea id="review-text" rows="4" required></textarea>
        </label>
        <label>Location (optional)
          <input type="text" id="review-location" placeholder="e.g. La Jolla">
        </label>
        <button type="submit" class="btn-primary" id="review-submit-btn">Add Review</button>
        <p id="review-form-error" class="admin-error" hidden></p>
        <p id="review-form-success" class="admin-success" hidden>Added.</p>
      </form>
    </section>

    <section class="admin-list">
      <h2 class="display">Existing Reviews</h2>
      <div class="admin-bulk-bar">
        <label class="admin-select-all-label"><input type="checkbox" id="reviews-select-all"> Select All</label>
        <span id="reviews-bulk-count" class="admin-bulk-count" hidden></span>
        <button type="button" class="admin-bulk-delete-btn" id="reviews-bulk-delete-btn" hidden>Delete Selected</button>
      </div>
      <div id="reviews-grid" class="admin-grid"></div>
      <p id="reviews-empty-msg" class="admin-empty" hidden></p>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/image-compress.js"></script>
<script>
(function () {
  var grid = document.getElementById('projects-grid');
  var emptyMsg = document.getElementById('empty-msg');
  var photosSelectAll = document.getElementById('photos-select-all');
  var photosBulkCount = document.getElementById('photos-bulk-count');
  var photosBulkDeleteBtn = document.getElementById('photos-bulk-delete-btn');
  var uploadForm = document.getElementById('upload-form');
  var uploadBtn = document.getElementById('upload-btn');
  var uploadStatus = document.getElementById('upload-status');
  var uploadWarning = document.getElementById('upload-warning');
  var uploadError = document.getElementById('upload-error');
  var uploadSuccess = document.getElementById('upload-success');
  var logoutBtn = document.getElementById('logout-btn');

  var BUCKET = 'job-photos';
  var PUBLIC_URL_MARKER = '/storage/v1/object/public/' + BUCKET + '/';

  var ALLOWED_IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
  var MAX_UPLOAD_BYTES = 25 * 1024 * 1024; // 25MB — generous for a phone photo

  // Validates a file BEFORE it touches Storage. Returns an error string, or
  // null if the file is acceptable. Without this, any file type (including
  // .html) could be uploaded to the public bucket, and a 0-byte or corrupt
  // file would become a permanently broken <img> on the public site.
  function validateImageFile(file) {
    if (!file) return 'Choose a photo to upload.';
    if (file.size === 0) return 'That file is empty (0 bytes). Try selecting the photo again.';
    if (file.size > MAX_UPLOAD_BYTES) {
      return 'That photo is ' + (file.size / 1024 / 1024).toFixed(1) + 'MB. Please use one under 25MB.';
    }
    if (ALLOWED_IMAGE_TYPES.indexOf(file.type) === -1) {
      return "That file isn't a supported image. Use JPEG, PNG, WebP, or GIF. "
        + "(iPhone HEIC photos aren't readable in Chrome or Firefox — set your iPhone to "
        + "Settings > Camera > Formats > Most Compatible, or upload using Safari.)";
    }
    return null;
  }

  // Chrome and Firefox cannot decode HEIC/HEIF via Canvas. Previously the
  // original was uploaded anyway, which produced a broken image on the public
  // site while telling the admin it merely "may be larger than usual". These
  // reasons are now hard failures — validateImageFile catches most of them up
  // front, and this catches anything that still fails to decode.
  function skipReasonMessage(reason) {
    if (reason === 'unsupported-type' || reason === 'decode-failed') {
      return "This photo couldn't be read by the browser, so it wasn't uploaded "
        + "(it would have shown as a broken image on the site). If it's an iPhone HEIC "
        + "photo, upload it from Safari or re-save it as JPEG first.";
    }
    return null;
  }

  function escapeHtml(str) {
    // Safe for BOTH text and attribute contexts. The previous textContent ->
    // innerHTML trick did not escape quotes, so a value like  x" onmouseover="..."
    // could break out of an attribute and inject an event handler.
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function pathFromPublicUrl(url) {
    var idx = url.indexOf(PUBLIC_URL_MARKER);
    if (idx === -1) return null;
    return decodeURIComponent(url.slice(idx + PUBLIC_URL_MARKER.length));
  }

  // Wires a "select all" checkbox + per-row .admin-row-check boxes inside
  // containerEl to a bulk-count label and a bulk-delete button, showing/
  // hiding them as selection changes. Reused across Photos, Leads, Reviews.
  function setupBulkSelection(containerEl, selectAllEl, countEl, deleteBtnEl, itemNoun) {
    function getCheckboxes() {
      return Array.prototype.slice.call(containerEl.querySelectorAll('.admin-row-check'));
    }
    function getChecked() {
      return getCheckboxes().filter(function (cb) { return cb.checked; });
    }
    function refresh() {
      var all = getCheckboxes();
      var checked = getChecked();
      if (selectAllEl) {
        selectAllEl.checked = all.length > 0 && checked.length === all.length;
        selectAllEl.indeterminate = checked.length > 0 && checked.length < all.length;
      }
      if (checked.length > 0) {
        countEl.textContent = checked.length + ' ' + itemNoun + (checked.length === 1 ? '' : 's') + ' selected';
        countEl.hidden = false;
        deleteBtnEl.hidden = false;
      } else {
        countEl.hidden = true;
        deleteBtnEl.hidden = true;
      }
    }
    containerEl.addEventListener('change', function (e) {
      if (e.target.classList.contains('admin-row-check')) refresh();
    });
    if (selectAllEl) {
      selectAllEl.addEventListener('change', function () {
        getCheckboxes().forEach(function (cb) { cb.checked = selectAllEl.checked; });
        refresh();
      });
    }
    return { getChecked: getChecked, refresh: refresh };
  }

  var photosSelection = setupBulkSelection(grid, photosSelectAll, photosBulkCount, photosBulkDeleteBtn, 'photo');

  async function requireSession() {
    var res = await supabaseClient.auth.getSession();
    if (!res.data.session) {
      window.location.replace('login.html');
      return null;
    }
    return res.data.session;
  }

  async function loadProjects() {
    var res = await supabaseClient
      .from('projects')
      .select('*')
      .order('created_at', { ascending: false });

    grid.innerHTML = '';
    photosSelection.refresh();

    if (res.error) {
      emptyMsg.textContent = 'Could not load photos: ' + res.error.message;
      emptyMsg.hidden = false;
      return;
    }

    if (!res.data || res.data.length === 0) {
      emptyMsg.textContent = 'No photos yet. Upload your first one above.';
      emptyMsg.hidden = false;
      return;
    }

    emptyMsg.hidden = true;

    res.data.forEach(function (project) {
      var path = pathFromPublicUrl(project.image_url) || '';
      var card = document.createElement('div');
      card.className = 'admin-card';
      var featured = !!project.is_featured;
      card.innerHTML =
        '<img src="' + escapeHtml(project.image_url) + '" alt="' + escapeHtml(project.title) + '">' +
        '<div class="admin-card-body">' +
          '<label class="admin-card-select"><input type="checkbox" class="admin-row-check" data-id="' + project.id + '" data-path="' + escapeHtml(path) + '"> Select</label>' +
          '<h3>' + escapeHtml(project.title) + '</h3>' +
          (project.category ? '<span class="admin-card-category">' + escapeHtml(project.category) + '</span>' : '') +
          (project.description ? '<p>' + escapeHtml(project.description) + '</p>' : '') +
          '<div class="admin-card-actions">' +
            '<button type="button" class="admin-feature-btn' + (featured ? ' is-featured' : '') + '" data-id="' + project.id + '" data-featured="' + featured + '">' +
              (featured ? '★ Featured' : '☆ Feature for Hero') +
            '</button>' +
            '<button type="button" class="admin-delete-btn" data-id="' + project.id + '" data-path="' + escapeHtml(path) + '">Delete</button>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });
  }

  uploadForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    uploadError.hidden = true;
    uploadSuccess.hidden = true;
    uploadStatus.hidden = true;
    uploadWarning.hidden = true;

    var title = document.getElementById('title').value.trim();
    var description = document.getElementById('description').value.trim();
    var category = document.getElementById('category').value.trim();
    var fileInput = document.getElementById('file');
    var file = fileInput.files[0];

    if (!title) {
      uploadError.textContent = 'Title and photo are required.';
      uploadError.hidden = false;
      return;
    }

    var fileError = validateImageFile(file);
    if (fileError) {
      uploadError.textContent = fileError;
      uploadError.hidden = false;
      return;
    }

    uploadBtn.disabled = true;
    uploadStatus.hidden = false;

    var fileToUpload = file;
    if (window.RedlineImageCompress) {
      var compressResult = await window.RedlineImageCompress.compressImage(file);
      var blockingMsg = skipReasonMessage(compressResult.reason);
      if (blockingMsg) {
        // Undecodable in this browser — abort rather than upload a file that
        // would render as a broken image for every visitor.
        uploadStatus.hidden = true;
        uploadBtn.disabled = false;
        uploadError.textContent = blockingMsg;
        uploadError.hidden = false;
        return;
      }
      fileToUpload = compressResult.file;
    }

    uploadStatus.hidden = true;

    // Extension comes from the validated MIME type, never from the user's
    // filename, so a crafted name can't control the stored object's extension.
    var MIME_EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif' };
    var ext = MIME_EXT[fileToUpload.type] || 'jpg';
    var path = Date.now() + '-' + Math.random().toString(36).slice(2) + '.' + ext;

    var uploadRes = await supabaseClient.storage.from(BUCKET).upload(path, fileToUpload);
    if (uploadRes.error) {
      uploadError.textContent = uploadRes.error.message;
      uploadError.hidden = false;
      uploadBtn.disabled = false;
      return;
    }

    var publicUrlRes = supabaseClient.storage.from(BUCKET).getPublicUrl(path);
    var imageUrl = publicUrlRes.data.publicUrl;

    var insertRes = await supabaseClient.from('projects').insert({
      title: title,
      description: description || null,
      category: category || null,
      image_url: imageUrl
    });

    uploadBtn.disabled = false;

    if (insertRes.error) {
      uploadError.textContent = insertRes.error.message;
      uploadError.hidden = false;
      return;
    }

    uploadSuccess.hidden = false;
    uploadForm.reset();
    loadProjects();
  });

  grid.addEventListener('click', async function (e) {
    var featureBtn = e.target.closest('.admin-feature-btn');
    if (featureBtn) {
      var featureId = featureBtn.getAttribute('data-id');
      var wasFeatured = featureBtn.getAttribute('data-featured') === 'true';
      featureBtn.disabled = true;

      var featureRes = await supabaseClient
        .from('projects')
        .update({ is_featured: !wasFeatured })
        .eq('id', featureId);

      featureBtn.disabled = false;

      if (featureRes.error) {
        window.alert('Could not update featured status: ' + featureRes.error.message);
        return;
      }

      loadProjects();
      return;
    }

    var btn = e.target.closest('.admin-delete-btn');
    if (!btn) return;
    if (!window.confirm('Delete this photo? This cannot be undone.')) return;

    var id = btn.getAttribute('data-id');
    var path = btn.getAttribute('data-path');
    btn.disabled = true;

    if (path) {
      await supabaseClient.storage.from(BUCKET).remove([path]);
    }

    var delRes = await supabaseClient.from('projects').delete().eq('id', id);
    if (delRes.error) {
      window.alert('Could not delete: ' + delRes.error.message);
      btn.disabled = false;
      return;
    }

    loadProjects();
  });

  photosBulkDeleteBtn.addEventListener('click', async function () {
    var checked = photosSelection.getChecked();
    if (checked.length === 0) return;
    if (!window.confirm('Delete ' + checked.length + ' photo' + (checked.length === 1 ? '' : 's') + '?')) return;

    photosBulkDeleteBtn.disabled = true;
    var ids = checked.map(function (cb) { return cb.getAttribute('data-id'); });
    var paths = checked.map(function (cb) { return cb.getAttribute('data-path'); }).filter(Boolean);

    if (paths.length) {
      await supabaseClient.storage.from(BUCKET).remove(paths);
    }

    var bulkDelRes = await supabaseClient.from('projects').delete().in('id', ids);
    photosBulkDeleteBtn.disabled = false;

    if (bulkDelRes.error) {
      window.alert('Could not delete: ' + bulkDelRes.error.message);
      return;
    }

    loadProjects();
  });

  logoutBtn.addEventListener('click', async function () {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  // ---- Tabs ----
  var tabBtns = document.querySelectorAll('.admin-tab-btn');
  var tabPanels = {
    photos: document.getElementById('tab-photos'),
    leads: document.getElementById('tab-leads'),
    business: document.getElementById('tab-business'),
    reviews: document.getElementById('tab-reviews')
  };
  tabBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var tab = btn.getAttribute('data-tab');
      tabBtns.forEach(function (b) { b.classList.toggle('is-active', b === btn); });
      Object.keys(tabPanels).forEach(function (key) {
        tabPanels[key].hidden = key !== tab;
      });
    });
  });

  // ---- Leads ----
  var leadsTbody = document.getElementById('leads-tbody');
  var leadsEmptyMsg = document.getElementById('leads-empty-msg');
  var leadsSelectAll = document.getElementById('leads-select-all');
  var leadsBulkCount = document.getElementById('leads-bulk-count');
  var leadsBulkDeleteBtn = document.getElementById('leads-bulk-delete-btn');
  var leadsSelection = setupBulkSelection(leadsTbody, leadsSelectAll, leadsBulkCount, leadsBulkDeleteBtn, 'lead');
  var STATUS_OPTIONS = ['new', 'contacted', 'quoted', 'won', 'lost'];
  var STATUS_LABELS = { new: 'New', contacted: 'Contacted', quoted: 'Quoted', won: 'Won', lost: 'Lost' };

  function formatDate(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  async function loadLeads() {
    var res = await supabaseClient
      .from('leads')
      .select('*')
      .order('created_at', { ascending: false });

    leadsTbody.innerHTML = '';
    leadsSelection.refresh();

    if (res.error) {
      leadsEmptyMsg.textContent = 'Could not load leads: ' + res.error.message;
      leadsEmptyMsg.hidden = false;
      return;
    }

    if (!res.data || res.data.length === 0) {
      leadsEmptyMsg.textContent = 'No leads yet.';
      leadsEmptyMsg.hidden = false;
      return;
    }

    leadsEmptyMsg.hidden = true;

    res.data.forEach(function (lead) {
      var tr = document.createElement('tr');
      var options = STATUS_OPTIONS.map(function (opt) {
        var selected = opt === lead.status ? ' selected' : '';
        return '<option value="' + opt + '"' + selected + '>' + STATUS_LABELS[opt] + '</option>';
      }).join('');
      tr.innerHTML =
        '<td><input type="checkbox" class="admin-row-check" data-id="' + lead.id + '"></td>' +
        '<td>' + escapeHtml(lead.name) + '</td>' +
        '<td>' + escapeHtml(lead.phone) + '</td>' +
        '<td>' + (lead.email ? escapeHtml(lead.email) : '—') + '</td>' +
        '<td>' + (lead.service_interest ? escapeHtml(lead.service_interest) : '—') + '</td>' +
        '<td class="admin-table-message">' + (lead.message ? escapeHtml(lead.message) : '—') + '</td>' +
        '<td><select class="admin-status-select" data-id="' + lead.id + '">' + options + '</select></td>' +
        '<td>' + formatDate(lead.created_at) + '</td>' +
        '<td><button type="button" class="admin-delete-btn admin-row-delete-btn" data-id="' + lead.id + '" data-name="' + escapeHtml(lead.name) + '">Delete</button></td>';
      leadsTbody.appendChild(tr);
    });
  }

  leadsTbody.addEventListener('change', async function (e) {
    var select = e.target.closest('.admin-status-select');
    if (!select) return;

    var id = select.getAttribute('data-id');
    var newStatus = select.value;
    select.disabled = true;

    var res = await supabaseClient.from('leads').update({ status: newStatus }).eq('id', id);

    select.disabled = false;

    if (res.error) {
      window.alert('Could not update status: ' + res.error.message);
    }
  });

  leadsTbody.addEventListener('click', async function (e) {
    var delBtn = e.target.closest('.admin-row-delete-btn');
    if (!delBtn) return;

    var name = delBtn.getAttribute('data-name');
    if (!window.confirm('Delete this lead from ' + name + '?')) return;

    var id = delBtn.getAttribute('data-id');
    delBtn.disabled = true;

    var delRes = await supabaseClient.from('leads').delete().eq('id', id);
    if (delRes.error) {
      window.alert('Could not delete: ' + delRes.error.message);
      delBtn.disabled = false;
      return;
    }

    loadLeads();
  });

  leadsBulkDeleteBtn.addEventListener('click', async function () {
    var checked = leadsSelection.getChecked();
    if (checked.length === 0) return;
    if (!window.confirm('Delete ' + checked.length + ' lead' + (checked.length === 1 ? '' : 's') + '?')) return;

    leadsBulkDeleteBtn.disabled = true;
    var ids = checked.map(function (cb) { return cb.getAttribute('data-id'); });

    var bulkDelRes = await supabaseClient.from('leads').delete().in('id', ids);
    leadsBulkDeleteBtn.disabled = false;

    if (bulkDelRes.error) {
      window.alert('Could not delete: ' + bulkDelRes.error.message);
      return;
    }

    loadLeads();
  });

  // ---- Business Info ----
  var businessForm = document.getElementById('business-form');
  var businessSaveBtn = document.getElementById('business-save-btn');
  var businessStatus = document.getElementById('business-status');
  var businessWarning = document.getElementById('business-warning');
  var businessError = document.getElementById('business-error');
  var businessSuccess = document.getElementById('business-success');
  var bizPhotoPreviewWrap = document.getElementById('biz-photo-preview-wrap');
  var bizPhotoPreview = document.getElementById('biz-photo-preview');
  var currentBusinessInfo = null;

  async function loadBusinessInfo() {
    var res = await supabaseClient.from('business_info').select('*').limit(1).maybeSingle();
    if (res.error || !res.data) {
      businessError.textContent = res.error ? ('Could not load business info: ' + res.error.message) : 'No business info row found.';
      businessError.hidden = false;
      return;
    }

    currentBusinessInfo = res.data;
    document.getElementById('biz-phone').value = res.data.phone || '';
    document.getElementById('biz-whatsapp').value = res.data.whatsapp || '';
    document.getElementById('biz-email').value = res.data.email || '';
    document.getElementById('biz-hours').value = res.data.hours || '';
    document.getElementById('biz-service-areas').value = res.data.service_areas || '';
    document.getElementById('biz-about').value = res.data.about_text || '';

    if (res.data.profile_photo_url) {
      bizPhotoPreview.src = res.data.profile_photo_url;
      bizPhotoPreviewWrap.hidden = false;
    } else {
      bizPhotoPreviewWrap.hidden = true;
    }
  }

  businessForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    businessError.hidden = true;
    businessSuccess.hidden = true;
    businessStatus.hidden = true;
    businessWarning.hidden = true;

    if (!currentBusinessInfo) {
      businessError.textContent = 'Business info has not loaded yet. Try again in a moment.';
      businessError.hidden = false;
      return;
    }

    var photoFile = document.getElementById('biz-photo-file').files[0];
    var profilePhotoUrl = currentBusinessInfo.profile_photo_url || null;

    if (photoFile) {
      var bizFileError = validateImageFile(photoFile);
      if (bizFileError) {
        businessError.textContent = bizFileError;
        businessError.hidden = false;
        return;
      }
    }

    businessSaveBtn.disabled = true;

    if (photoFile) {
      businessStatus.hidden = false;

      var photoToUpload = photoFile;
      if (window.RedlineImageCompress) {
        var bizCompressResult = await window.RedlineImageCompress.compressImage(photoFile);
        var bizBlockingMsg = skipReasonMessage(bizCompressResult.reason);
        if (bizBlockingMsg) {
          businessStatus.hidden = true;
          businessSaveBtn.disabled = false;
          businessError.textContent = bizBlockingMsg;
          businessError.hidden = false;
          return;
        }
        photoToUpload = bizCompressResult.file;
      }

      businessStatus.hidden = true;

      var BIZ_MIME_EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif' };
      var ext = BIZ_MIME_EXT[photoToUpload.type] || 'jpg';
      var path = 'profile/' + Date.now() + '-' + Math.random().toString(36).slice(2) + '.' + ext;

      var uploadRes = await supabaseClient.storage.from(BUCKET).upload(path, photoToUpload);
      if (uploadRes.error) {
        businessError.textContent = uploadRes.error.message;
        businessError.hidden = false;
        businessSaveBtn.disabled = false;
        return;
      }

      var publicUrlRes = supabaseClient.storage.from(BUCKET).getPublicUrl(path);
      profilePhotoUrl = publicUrlRes.data.publicUrl;
    }

    var updates = {
      phone: document.getElementById('biz-phone').value.trim() || null,
      whatsapp: document.getElementById('biz-whatsapp').value.trim() || null,
      email: document.getElementById('biz-email').value.trim() || null,
      hours: document.getElementById('biz-hours').value.trim() || null,
      service_areas: document.getElementById('biz-service-areas').value.trim() || null,
      about_text: document.getElementById('biz-about').value.trim() || null,
      profile_photo_url: profilePhotoUrl,
      updated_at: new Date().toISOString()
    };

    var updateRes = await supabaseClient
      .from('business_info')
      .update(updates)
      .eq('id', currentBusinessInfo.id)
      .select()
      .maybeSingle();

    businessSaveBtn.disabled = false;

    if (updateRes.error) {
      businessError.textContent = updateRes.error.message;
      businessError.hidden = false;
      return;
    }

    currentBusinessInfo = updateRes.data || Object.assign({}, currentBusinessInfo, updates);
    document.getElementById('biz-photo-file').value = '';

    if (currentBusinessInfo.profile_photo_url) {
      bizPhotoPreview.src = currentBusinessInfo.profile_photo_url;
      bizPhotoPreviewWrap.hidden = false;
    } else {
      bizPhotoPreviewWrap.hidden = true;
    }

    businessSuccess.hidden = false;
  });

  // ---- Reviews ----
  var reviewForm = document.getElementById('review-form');
  var reviewSubmitBtn = document.getElementById('review-submit-btn');
  var reviewFormError = document.getElementById('review-form-error');
  var reviewFormSuccess = document.getElementById('review-form-success');
  var reviewsGrid = document.getElementById('reviews-grid');
  var reviewsEmptyMsg = document.getElementById('reviews-empty-msg');
  var reviewsSelectAll = document.getElementById('reviews-select-all');
  var reviewsBulkCount = document.getElementById('reviews-bulk-count');
  var reviewsBulkDeleteBtn = document.getElementById('reviews-bulk-delete-btn');
  var reviewsSelection = setupBulkSelection(reviewsGrid, reviewsSelectAll, reviewsBulkCount, reviewsBulkDeleteBtn, 'review');

  function starString(rating) {
    // Round first: repeat() truncates, so 4.5 used to render 4 filled + 0 empty
    // (only 4 glyphs). A null/invalid rating now falls back to 5, not 1.
    var n = Number(rating);
    var r = Math.round(Math.max(1, Math.min(5, isFinite(n) && n > 0 ? n : 5)));
    return '★'.repeat(r) + '☆'.repeat(5 - r);
  }

  async function loadReviews() {
    var res = await supabaseClient
      .from('reviews')
      .select('*')
      .order('created_at', { ascending: false });

    reviewsGrid.innerHTML = '';
    reviewsSelection.refresh();

    if (res.error) {
      reviewsEmptyMsg.textContent = 'Could not load reviews: ' + res.error.message;
      reviewsEmptyMsg.hidden = false;
      return;
    }

    if (!res.data || res.data.length === 0) {
      reviewsEmptyMsg.textContent = 'No reviews yet. Add your first one above.';
      reviewsEmptyMsg.hidden = false;
      return;
    }

    reviewsEmptyMsg.hidden = true;

    res.data.forEach(function (review) {
      var published = !!review.is_published;
      var card = document.createElement('div');
      card.className = 'admin-card';
      card.innerHTML =
        '<div class="admin-card-body">' +
          '<label class="admin-card-select"><input type="checkbox" class="admin-row-check" data-id="' + review.id + '"> Select</label>' +
          '<div class="admin-review-stars">' + starString(review.rating) + '</div>' +
          '<h3>' + escapeHtml(review.customer_name) + '</h3>' +
          (review.location ? '<span class="admin-card-category">' + escapeHtml(review.location) + '</span>' : '') +
          '<p>' + escapeHtml(review.review_text) + '</p>' +
          '<div class="admin-card-actions">' +
            '<button type="button" class="admin-feature-btn' + (published ? ' is-featured' : '') + '" data-id="' + review.id + '" data-published="' + published + '">' +
              (published ? '★ Published' : '☆ Unpublished') +
            '</button>' +
            '<button type="button" class="admin-delete-btn" data-id="' + review.id + '">Delete</button>' +
          '</div>' +
        '</div>';
      reviewsGrid.appendChild(card);
    });
  }

  reviewForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    reviewFormError.hidden = true;
    reviewFormSuccess.hidden = true;

    var name = document.getElementById('review-name').value.trim();
    var rating = parseInt(document.getElementById('review-rating').value, 10);
    var text = document.getElementById('review-text').value.trim();
    var location = document.getElementById('review-location').value.trim();

    if (!name || !text) {
      reviewFormError.textContent = 'Customer name and review text are required.';
      reviewFormError.hidden = false;
      return;
    }

    reviewSubmitBtn.disabled = true;

    var res = await supabaseClient.from('reviews').insert({
      customer_name: name,
      rating: rating,
      review_text: text,
      location: location || null
    });

    reviewSubmitBtn.disabled = false;

    if (res.error) {
      reviewFormError.textContent = res.error.message;
      reviewFormError.hidden = false;
      return;
    }

    reviewFormSuccess.hidden = false;
    reviewForm.reset();
    loadReviews();
  });

  reviewsGrid.addEventListener('click', async function (e) {
    var toggleBtn = e.target.closest('.admin-feature-btn');
    if (toggleBtn) {
      var toggleId = toggleBtn.getAttribute('data-id');
      var wasPublished = toggleBtn.getAttribute('data-published') === 'true';
      toggleBtn.disabled = true;

      var toggleRes = await supabaseClient
        .from('reviews')
        .update({ is_published: !wasPublished })
        .eq('id', toggleId);

      toggleBtn.disabled = false;

      if (toggleRes.error) {
        window.alert('Could not update review: ' + toggleRes.error.message);
        return;
      }

      loadReviews();
      return;
    }

    var delBtn = e.target.closest('.admin-delete-btn');
    if (!delBtn) return;
    if (!window.confirm('Delete this review? This cannot be undone.')) return;

    var delId = delBtn.getAttribute('data-id');
    delBtn.disabled = true;

    var delRes = await supabaseClient.from('reviews').delete().eq('id', delId);
    if (delRes.error) {
      window.alert('Could not delete: ' + delRes.error.message);
      delBtn.disabled = false;
      return;
    }

    loadReviews();
  });

  reviewsBulkDeleteBtn.addEventListener('click', async function () {
    var checked = reviewsSelection.getChecked();
    if (checked.length === 0) return;
    if (!window.confirm('Delete ' + checked.length + ' review' + (checked.length === 1 ? '' : 's') + '?')) return;

    reviewsBulkDeleteBtn.disabled = true;
    var ids = checked.map(function (cb) { return cb.getAttribute('data-id'); });

    var bulkDelRes = await supabaseClient.from('reviews').delete().in('id', ids);
    reviewsBulkDeleteBtn.disabled = false;

    if (bulkDelRes.error) {
      window.alert('Could not delete: ' + bulkDelRes.error.message);
      return;
    }

    loadReviews();
  });

  (async function init() {
    var session = await requireSession();
    if (!session) return;
    loadProjects();
    loadLeads();
    loadBusinessInfo();
    loadReviews();
  })();
})();
</script>

</body>
</html>
