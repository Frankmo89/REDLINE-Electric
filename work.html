<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Work — Redline Electric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header" id="site-header">
  <div class="wrap header-inner">
    <a href="index.html#home" class="logo-link" aria-label="Redline Electric — Home">
      <img src="assets/redline-electric-logo.png" alt="Redline Electric">
    </a>

    <nav class="main-nav" id="main-nav">
      <button type="button" class="nav-close" id="nav-close" aria-label="Close menu">&times;</button>
      <ul>
        <li><a href="index.html#home" class="nav-link">Home</a></li>
        <li><a href="index.html#services" class="nav-link">Services</a></li>
        <li><a href="index.html#why-us" class="nav-link">Why Choose Us</a></li>
        <li><a href="work.html" class="nav-link">Our Work</a></li>
        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <a href="tel:+16193625347" class="btn-primary btn-header-cta" data-phone-link>Call Now</a>
      <button type="button" class="hamburger" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<section class="work">
  <div class="wrap">
    <h1 class="display">Our Work</h1>
    <p class="sub">A look at recent electrical projects across San Diego.</p>

    <div class="filter-pills" id="filter-pills"></div>

    <div class="work-grid" id="work-grid">
      <p class="work-empty" id="work-empty" hidden>Photos coming soon.</p>
    </div>
  </div>
</section>

<section class="trust">
  <div class="wrap">
    <div class="trust-badges" style="margin-top: 0; padding-top: 0; border-top: none;">
      <div class="badge">
        <div class="swatch">✓</div>
        <div><span>License</span><strong>C-10 #1153394</strong></div>
      </div>
      <div class="badge">
        <div class="swatch">$</div>
        <div><span>Insurance</span><strong>Fully covered</strong></div>
      </div>
      <div class="badge">
        <div class="swatch">SD</div>
        <div><span>Service Area</span><strong data-service-areas-text>San Diego County</strong></div>
      </div>
    </div>
  </div>
</section>

<script>
(function () {
  var header = document.getElementById('site-header');
  var toggle = document.getElementById('nav-toggle');
  var closeBtn = document.getElementById('nav-close');
  var nav = document.getElementById('main-nav');
  var navLinks = nav.querySelectorAll('a');

  function updateScrolledState() {
    if (window.scrollY > 40) {
      header.classList.add('is-scrolled');
    } else {
      header.classList.remove('is-scrolled');
    }
  }
  window.addEventListener('scroll', updateScrolledState, { passive: true });
  updateScrolledState();

  function closeNav() {
    nav.classList.remove('is-open');
    toggle.classList.remove('is-active');
    toggle.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('nav-locked');
  }
  function openNav() {
    nav.classList.add('is-open');
    toggle.classList.add('is-active');
    toggle.setAttribute('aria-expanded', 'true');
    document.body.classList.add('nav-locked');
  }

  toggle.addEventListener('click', function () {
    if (nav.classList.contains('is-open')) {
      closeNav();
    } else {
      openNav();
    }
  });
  closeBtn.addEventListener('click', closeNav);
  navLinks.forEach(function (link) {
    link.addEventListener('click', closeNav);
  });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/business-info.js"></script>
<script>
(function () {
  var grid = document.getElementById('work-grid');
  var emptyMsg = document.getElementById('work-empty');
  var pillsWrap = document.getElementById('filter-pills');
  if (!grid || typeof supabaseClient === 'undefined') return;

  var allProjects = [];
  var activeCategory = 'All';

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function showEmpty(message) {
    grid.innerHTML = '';
    emptyMsg.textContent = message;
    emptyMsg.hidden = false;
    grid.appendChild(emptyMsg);
  }

  function renderPills() {
    var categories = [];
    allProjects.forEach(function (p) {
      if (p.category && categories.indexOf(p.category) === -1) {
        categories.push(p.category);
      }
    });
    categories.sort();

    var labels = ['All'].concat(categories);

    pillsWrap.innerHTML = '';
    labels.forEach(function (label) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'filter-pill' + (label === activeCategory ? ' is-active' : '');
      btn.textContent = label;
      btn.setAttribute('data-category', label);
      pillsWrap.appendChild(btn);
    });
  }

  function renderGrid() {
    var filtered = activeCategory === 'All'
      ? allProjects
      : allProjects.filter(function (p) { return p.category === activeCategory; });

    grid.innerHTML = '';

    if (filtered.length === 0) {
      showEmpty('No photos in this category yet.');
      return;
    }

    emptyMsg.hidden = true;

    filtered.forEach(function (project) {
      var item = document.createElement('div');
      item.className = 'work-photo';
      item.innerHTML =
        '<img src="' + project.image_url + '" alt="' + escapeHtml(project.title) + '" loading="lazy">' +
        '<div class="work-caption">' +
          '<strong>' + escapeHtml(project.title) + '</strong>' +
          (project.category ? '<span>' + escapeHtml(project.category) + '</span>' : '') +
        '</div>';
      grid.appendChild(item);
    });
  }

  pillsWrap.addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-pill');
    if (!btn) return;
    activeCategory = btn.getAttribute('data-category');
    renderPills();
    renderGrid();
  });

  supabaseClient
    .from('projects')
    .select('*')
    .order('created_at', { ascending: false })
    .then(function (res) {
      if (res.error || !res.data || res.data.length === 0) {
        showEmpty('Photos coming soon.');
        return;
      }

      allProjects = res.data;
      renderPills();
      renderGrid();
    })
    .catch(function () {
      showEmpty('Photos coming soon.');
    });
})();
</script>

</body>
</html>
